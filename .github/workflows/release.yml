name: Build and publish Latch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read VERSION
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n ' < VERSION)"
          if [ -z "$VERSION" ]; then
            echo "VERSION is empty"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "${{ steps.version.outputs.tag }}" || {
            echo "Tag ${GITHUB_REF_NAME} and VERSION ${{ steps.version.outputs.version }} disagree"
            exit 1
          }

      - name: Ensure release tag for manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already exists at $TAG_COMMIT, not this release commit $GITHUB_SHA."
              echo "Refusing to move an existing release tag."
              exit 1
            fi
            echo "Tag $TAG already points to this commit; resuming release."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Build and test release
        run: bash ./scripts/build-release.sh

      - name: Locate release artifacts
        id: artifacts
        shell: bash
        run: |
          echo "dist contents:"
          find dist -maxdepth 1 -type f -printf '%f\n' | sort

          SDK="$(find dist -maxdepth 1 -type f -name 'LatchSDK-*-windows.zip' -print -quit)"
          VSIX="$(find dist -maxdepth 1 -type f -name 'latch-language-*.vsix' -print -quit)"

          if [ -z "$SDK" ]; then
            echo "No Windows Latch SDK ZIP was produced."
            exit 1
          fi
          if [ -z "$VSIX" ]; then
            echo "No Latch VSIX was produced."
            exit 1
          fi

          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SDK: ${{ steps.artifacts.outputs.sdk }}
          VSIX: ${{ steps.artifacts.outputs.vsix }}
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Latch $VERSION" --generate-notes
          gh release upload "$TAG" "$SDK" "$VSIX" --clobber

      - name: Update public release manifest
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SDK: ${{ steps.artifacts.outputs.sdk }}
          VSIX: ${{ steps.artifacts.outputs.vsix }}
        shell: bash
        run: |
          SDK_NAME="$(basename "$SDK")"
          VSIX_NAME="$(basename "$VSIX")"
          cat > release-manifest.json <<EOF
          {
            "version": "$VERSION",
            "channel": "alpha",
            "downloadUrl": "https://github.com/AirzOverload/Latch/releases/download/$TAG/$VSIX_NAME",
            "sdkUrl": "https://github.com/AirzOverload/Latch/releases/download/$TAG/$SDK_NAME",
            "notesUrl": "https://github.com/AirzOverload/Latch/releases/tag/$TAG"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-manifest.json
          if git diff --cached --quiet; then
            echo "Manifest already current."
          else
            git commit -m "Update release manifest for $VERSION"
            git push origin HEAD:main
          fi
