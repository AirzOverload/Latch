name: Build and publish Latch
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(tr -d '\r\n ' < VERSION)" || { echo "Tag and VERSION disagree"; exit 1; }
      - name: Build and test release
        run: bash ./scripts/build-release.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '\r\n ' < VERSION)"
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Latch $VERSION" --generate-notes
          gh release upload "$TAG" dist/*.vsix dist/*.zip --clobber
      - name: Update public release manifest on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout main
          cp dist/release-manifest.json release-manifest.json
          if git diff --quiet -- release-manifest.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-manifest.json
          git commit -m "Update Latch release manifest to $(cat VERSION)"
          git push origin main
